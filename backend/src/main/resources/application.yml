spring:
  application:
    name: snow-world
  datasource:
    url: ${SNOW_DB_URL:jdbc:postgresql://localhost:55432/snow_world}
    username: ${SNOW_DB_USER:snow}
    password: ${SNOW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Shanghai
  mvc:
    async:
      request-timeout: 180000

server:
  port: ${SNOW_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        name: SNOWSESSION
  error:
    include-stacktrace: never
    include-message: never

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
  type-handlers-package: com.snowworld.common.mybatis

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

snow:
  data-dir: ${SNOW_DATA_DIR:../data}
  storage-dir: ${SNOW_STORAGE_DIR:../runtime/storage}
  demo:
    seed: ${SNOW_DEMO_SEED:false}
    replay-at: ${SNOW_DEMO_REPLAY_AT:}
    history-from: ${SNOW_DEMO_HISTORY_FROM:2024-01-01}
    user-password: ${SNOW_DEMO_PASSWORD:}
  ai:
    provider: ${SNOW_AI_PROVIDER:fake}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
  video:
    provider: demo
    session-ttl-seconds: 120

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
